[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-veto-distillation"
version = "0.1.0"
description = "Distil an LLM's trade-veto decisions into small, fast models, and measure what survives."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
import = ["pyarrow>=16"]
teacher = ["google-genai>=1.0"]

[project.scripts]
vd = "veto_distill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
